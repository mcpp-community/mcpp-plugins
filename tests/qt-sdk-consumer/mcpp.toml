# Fixture: the Qt SDK named by the project, at the levels `rules-qt` consults
# (docs/rules-qt.md, "The SDK"). The edge asks for `rules-qt` alone, which
# declares no SDK; the project declares `xim:qt-base` at a version of its own
# choosing. CI builds it so, then names a Qt through `QT_ROOT_DIR`, then
# through `options::root` (the build program reads `QT_SDK_CONSUMER_ROOT`, a
# value it computes), and reads the level the rule recorded as the fact
# `rules-qt.sdk` each time.
[package]
name        = "qt-sdk-consumer"
version     = "0.1.0"
description = "Fixture: a Qt SDK named by the project through rules-qt"
license     = "Apache-2.0"
authors     = ["mcpp-community"]

[language]
standard   = "c++23"
modules    = true
import_std = false

[build-dependencies.mcpp]
plugins = { path = "../..", features = ["rules-qt"], host-module = true }

[target.'cfg(any(windows, linux, macos))'.xlings.workspace]
"xim:qt-base" = "6.11.1"

[build]
sources = ["src/*.cpp"]

[targets.qt-sdk-consumer]
kind = "bin"
main = "src/main.cpp"

# Qt's Linux libraries load the shared libstdc++ (`libstdc++.so.6`), so on
# Linux the program uses the toolchain's shared C++ runtime rather than
# embedding a second one (mcpp's docs/20). The row is the host's own, which a
# plain `mcpp build` applies since mcpp 2026.9.27.1 (mcpp#704); macOS and
# the MSVC ABI keep mcpp's default.
[target.x86_64-linux-gnu]
cxx_runtime = "toolchain-coupled"

[target.aarch64-linux-gnu]
cxx_runtime = "toolchain-coupled"
