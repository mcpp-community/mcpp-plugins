# Fixture: a package that enables `rules-qt` only to import `mcpp.rules.qt`,
# the shape of a library of build logic that other packages' build programs
# import (a project's own build module). It writes no `build.mcpp`, has no `.ui`,
# `.qrc` or `.ts`, and declares no Qt, so mcpp synthesises no build program
# for it and nothing reports a missing SDK (mcpp 2026.9.27.1; mcpp#715).
[package]
name        = "qt-import-only"
version     = "0.1.0"
description = "Fixture: rules-qt enabled only for its module"
license     = "Apache-2.0"
authors     = ["mcpp-community"]

[language]
standard   = "c++23"
modules    = true
import_std = false

[build-dependencies.mcpp]
plugins = { path = "../..", features = ["rules-qt"], host-module = true }

[build]
sources = ["src/*.cpp"]

[targets.qt-import-only]
kind = "bin"
main = "src/main.cpp"
