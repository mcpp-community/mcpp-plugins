# Fixture: an Android library that states its contribution in
# `[package.metadata.dist-apk]`, and an application that names it only as a
# dependency (dist-apk 0.12.0, mcpp 2026.9.16.1).
#
# `lib/` is a path dependency whose manifest names its resources directory. The
# application's build program lists no library: with an engine that gives the
# root program the resolved graph, `dist-apk` reads the contribution from it and
# the library's string resource reaches the APK. With an older engine there is no
# graph, and the package is built without the contribution, as before.
[package]
name        = "apk-consumer-graph"
version     = "0.1.0"
description = "Fixture: dist-apk collects a library contribution from the resolved graph"
license     = "Apache-2.0"
authors     = ["mcpp-community"]

[language]
standard = "c++23"

[build-dependencies.mcpp]
plugins = { path = "../..", features = ["dist-apk"], host-module = true }

[dependencies]
mcpp.apk-graph-lib = { path = "lib" }

[targets.apk-consumer-graph]
kind = "app"
main = "src/main.cpp"

[target.'cfg(env = "android")'.runtime]
libraries = ["android", "log"]

[target.x86_64-linux-android]
min_api_level = 24
