# Fixture: an application target packaged as a signed, native (level 0) APK.
#
# It proves the third family end to end on the one row where the program
# itself is not the thing the graph links (#622 A3: `kind = "app"` on
# `*-linux-android` is a shared object, not an executable) and where the
# distributable's own closure is not the engine's (this member reads the
# staged tree's `lib/` and the ordinary build's `bin/` itself; see
# `dist/apk.cppm`'s header for what is measured and why).
[package]
name        = "apk-consumer"
version     = "0.3.0"
description = "Fixture: packages an app target as a signed APK"
license     = "Apache-2.0"
authors     = ["mcpp-community"]

[language]
standard   = "c++23"
modules    = true
import_std = true

[build-dependencies.mcpp]
plugins = { path = "../..", features = ["dist-apk"], host-module = true }

[targets.apk-consumer]
kind = "app"
main = "src/main.cpp"

# `ANativeActivity_onCreate` (src/main.cpp) calls `ANativeActivity_finish`
# and `__android_log_print`, both declared in `libandroid.so`/`liblog.so` --
# the NDK's own stable stub libraries for the platform's native-activity and
# logging ABIs, present in every system image `dist-apk` targets. Neither is
# pulled in by anything already linked, so the closure needs them stated,
# not inferred.
[target.'cfg(env = "android")'.runtime]
libraries = ["android", "log"]

# #622 A11: `minSdkVersion` reads `mcpp::min_platform_version()`, so the
# criterion below (`aapt2 dump badging` reporting `sdkVersion:'24'`) is a
# property of THIS declaration and not of a default this fixture never
# stated.
[target.x86_64-linux-android]
min_api_level = 24
runner = ["adb-run"]

# Same runner, the emulator's own guest abi. `adb-run` passes no `-s`
# (device selection is `adb`'s own -- ANDROID_SERIAL is the caller's
# configuration), so the identical declaration serves both the emulated
# x86_64 row and a physical arm64-v8a device.
[target.aarch64-linux-android]
min_api_level = 24
runner = ["adb-run"]
