[package]
name         = "sycl-consumer"
namespace    = "example"
version      = "0.1.0"
description  = "A SYCL kernel behind a seam module, reaching an NVIDIA device, with a CPU fallback"
# BOTH, for the reason the HIP consumer records: the glob below names the
# NVIDIA target the SYCL unit is compiled for, so `cuda` is a backend this
# package's sources are written for.
accelerators = ["sycl", "cuda"]

[language]
standard   = "c++23"
modules    = true
import_std = true

# The C++ half is mcpp's own clang. The device half cannot be: SYCL needs a
# compiler with the SYCL front end, which is what the dpcpp payload is, and
# that second compiler is the entire reason this rule exists.
[toolchain]
default = "llvm@22.1.8"

# `[build-dependencies]`, not `[dependencies]`: a rule package's library must
# never reach the target while its rule is still wanted, which is the case
# docs/05 section 2.6.1 exists for. `host-module = true` says which build-time
# product is wanted; the section says whether the package reaches the target.
[build-dependencies.mcpp]
plugins = { path = "../..", features = ["rules-sycl"], host-module = true }

# The SYCL runtime, on the artifact's runtime search path. mcpp's private
# loader does not consult /usr/lib, so `libsycl.so.9` -- which the rule
# satisfied at LINK time from the payload -- would not be found at run time.
#
# This is the ONLY compat entry a SYCL project needs, and that is the point of
# where the boundary was drawn: the runtime's CUDA back end dlopens the
# driver, so the adapter carries that hop. A project that writes SYCL does not
# have to know CUDA is underneath it.
[dependencies.compat]
sycl-runtime = "2026.09.07"

# NO [xlings.workspace]. The rule declares the payloads it drives, under the
# feature that selects it and the accelerator it serves, so this project names
# the rule and nothing else. Needs mcpp 2026.9.6.6; before it, a payload a
# dependency declared was installed and then answered as absent.
#
# `mcpp.rules.sycl` carries five, each closing one hole the host would
# otherwise fill: dpcpp (the compiler); gcc, glibc and linux-headers (the C++
# and C libraries the SYCL unit compiles against -- dpcpp's clang is not the
# clang mcpp resolved and is configured with neither, so left alone its search
# list reaches /usr/include with no ecosystem glibc on it); and cuda-nvcc,
# whose libdevice the NVIDIA back end needs -- declared only when the accel
# actually names cuda, so a SYCL build for another target does not pay for it.

[build]
# Two chunks: the programming model, and the device. Written `sycl` alone, the
# unit is compiled to SPIR-V and the runtime picks a device at run time; with
# the second chunk it is compiled ahead of time for that architecture.
accel = "sycl, cuda12.9+{sm_89}"
sources = [
  "src/*.cppm",
  "src/*.cpp",
  { glob = "src/kernels/**/*.sycl", accel = "sycl, cuda12.9+{sm_89}" },
]
include_dirs = ["include"]

# `-lsycl` and the libstdc++ half are NOT here: they are consequences of the
# compiler the rule chose, so the rule puts them on the link line itself
# through `mcpp::link_lib`. A manifest that named them would be stating a fact
# about a compiler it did not select.

# The CPU-only variant: the same seam, a host implementation behind it.
[target.'cfg(not(accelerator = "sycl"))'.build]
sources = ["src/cpu/*.cpp"]

[targets.sycl-consumer]
kind = "bin"
main = "src/main.cpp"
