# Fixture: a Qt 6 program that exercises each of Qt's code generators and its
# Linguist tools through `rules-qt`, with the SDK from `xim:qt-base` (qtbase,
# qttools and the QtQml library lupdate loads); tests/qt-widgets-consumer
# uses `xim:qt`.
#
# A console program on purpose: QtCore needs no display and no platform plugin,
# so the same program is built and RUN on every host in the matrix. What it
# covers:
#
#   src/counter.h       declares a Q_OBJECT class       -> moc
#   src/main.cpp        includes "main.moc"             -> moc, inline
#   res/app.qrc         names res/greeting.txt          -> rcc
#   qt_consumer_de.ts   updated from src/ by lupdate    -> lrelease, deployed
#                                                          under translations/
#
# The `.ts` sits in the package root, as it does in the validation project, so lupdate
# writes one file there and claims no directory.
#
# and the program prints what each produced: a signal delivered to a slot, a
# resource read through `:/`, and a string translated by the `.qm` it loaded
# from beside itself. `widgets/` is the second fixture, for Qt Widgets, `.ui`
# and the platform plugin.
[package]
name        = "qt-consumer"
version     = "0.1.0"
description = "Fixture: a Qt 6 console program built through rules-qt"
license     = "Apache-2.0"
authors     = ["mcpp-community"]

[language]
standard   = "c++23"
modules    = true
import_std = false

[build-dependencies.mcpp]
plugins = { path = "../..", features = ["rules-qt"], host-module = true }

# The SDK is the project's declaration, at the version it chooses.
[target.'cfg(any(windows, linux, macos))'.xlings.workspace]
"xim:qt-base" = "6.11.1"

[build]
sources = ["src/*.cpp", "res/*.qrc", "*.ts"]

[targets.qt-consumer]
kind = "bin"
main = "src/main.cpp"

# Qt's Linux libraries load the shared libstdc++ (`libstdc++.so.6`), so on
# Linux the program uses the toolchain's shared C++ runtime rather than
# embedding a second one (mcpp's docs/20). The row is the host's own, which a
# plain `mcpp build` applies since mcpp 2026.9.27.1 (mcpp#704); macOS and
# the MSVC ABI keep mcpp's default.
[target.x86_64-linux-gnu]
cxx_runtime = "toolchain-coupled"

[target.aarch64-linux-gnu]
cxx_runtime = "toolchain-coupled"
