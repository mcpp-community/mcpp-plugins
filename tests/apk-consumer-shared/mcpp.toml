# Fixture: an app target whose dependency is a SHARED object on the Android
# row -- the shape a framework takes there (the Java host loads it by name),
# and the one `dist-apk` used to lose. Under 0.9.2 `lib<dep>.so` reached
# neither `lib/` nor the APK; 0.9.3 walked the app's NEEDED at command time,
# behind a stamp that lost the library on a second pack. From mcpp 2026.9.14.2
# the engine stages the closure under `lib/` (`lib/<abi>/` for several targets)
# and names it in the stage manifest, and 0.10.0 packs that tree.
# `check-apk-closure.sh` states the criteria.
[package]
name        = "apk-consumer-shared"
version     = "0.2.0"
description = "Fixture: an APK whose graph carries a shared library"
license     = "Apache-2.0"
authors     = ["mcpp-community"]

[language]
standard = "c++23"

[build-dependencies.mcpp]
plugins = { path = "../..", features = ["dist-apk"], host-module = true }

# THE DEPENDENCY, DECLARED PER ROW. `linkage` is honoured in the root's own
# declaration only (docs/04), and one identity may be declared once, so the
# Android row and every other row each get their own table.
[target.'cfg(env = "android")'.dependencies]
mcpp.apk-consumer-dep = { path = "dep", linkage = "shared" }

[target.'cfg(not(env = "android"))'.dependencies]
mcpp.apk-consumer-dep = { path = "dep" }

[targets.apk-consumer-shared]
kind = "app"
main = "src/main.cpp"

[target.'cfg(env = "android")'.runtime]
libraries = ["android", "log"]

[target.x86_64-linux-android]
min_api_level = 24
runner = ["adb-run"]

[target.aarch64-linux-android]
min_api_level = 24
runner = ["adb-run"]
