[package]
name         = "hip-consumer"
namespace    = "example"
version      = "0.1.0"
description  = "A HIP kernel behind a seam module, reaching an NVIDIA device, with a CPU fallback"
# BOTH, because the constrained glob below names both. On the NVIDIA platform
# HIP compiles THROUGH the CUDA back end, so `cuda` is a backend this package's
# sources are written for even though nothing here says the word. mcpp refuses a
# glob naming a backend its package does not declare (2026.9.6.5+), which is
# what caught this list being short by one.
accelerators = ["hip", "cuda"]

[language]
standard   = "c++23"
modules    = true
import_std = true

# The same clang that compiles the C++ half compiles the device unit. HIP on
# the NVIDIA platform is a header layer over the CUDA runtime, so there is no
# hipcc, no ROCm, and no second host compiler to satisfy a bound for.
[toolchain]
default = "llvm@22.1.8"

# `[build-dependencies]`, not `[dependencies]`: a rule package's library must
# never reach the target while its rule is still wanted, which is the case
# docs/05 section 2.6.1 exists for. `host-module = true` says which build-time
# product is wanted; the section says whether the package reaches the target.
[build-dependencies.mcpp]
plugins = { path = "../..", features = ["rules-hip"], host-module = true }

# The driver's userspace library. HIP reaches the device through the CUDA
# runtime here, so this is the same one hop the CUDA consumer needs: mcpp's
# private loader does not consult /usr/lib, and without a directory on the
# artifact's runtime search path the statically linked CUDA runtime cannot
# dlopen the driver.
[dependencies.compat]
cuda-runtime = "2026.09.05"

# NO [xlings.workspace]. The rule declares the payloads it drives, under the
# feature that selects it and the accelerator it serves, so this project names
# the rule and nothing else. Needs mcpp 2026.9.6.6; before it, a payload a
# dependency declared was installed and then answered as absent.
#
# The list `mcpp.rules.hip` carries is the CUDA one plus `cuda-profiler-api`:
# `nvidia_hip_runtime_api.h` includes <cuda_profiler_api.h> at its second line,
# and a machine with a host CUDA installation finds that header in /usr/include
# without saying so -- which is how the entry came to be missing from a build
# that worked.

[build]
# Two chunks: the programming model, and the device. A device is spelled once
# in this ecosystem however many models reach it, so `sm_89` here is the same
# `sm_89` the CUDA consumer writes.
accel = "hip, cuda12.9+{sm_89}"
sources = [
  "src/*.cppm",
  "src/*.cpp",
  { glob = "src/kernels/**/*.hip", accel = "hip, cuda12.9+{sm_89}" },
]
include_dirs = ["include"]

[target.'cfg(accelerator = "hip")'.build]
ldflags = ["-lcudart_static", "-lrt", "-lpthread", "-ldl"]

# The CPU-only variant: the same seam, a host implementation behind it.
[target.'cfg(not(accelerator = "hip"))'.build]
sources = ["src/cpu/*.cpp"]

[targets.hip-consumer]
kind = "bin"
main = "src/main.cpp"
