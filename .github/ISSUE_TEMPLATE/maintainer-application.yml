name: Member maintainer application
description: Apply to become the maintainer of one member of mcpp-plugins
labels: ["maintainer-application"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for wanting to take a member's maintainership. One application
        covers one member.

        A maintainer knows the member deeply and its application domain, and
        leads its popularization and ecosystem building — technical articles,
        videos, tutorials. Development plus outreach is the core of the role,
        and the application states contributions in both categories.
  - type: input
    id: member
    attributes:
      label: The member you apply for
      description: One member per application — for another, open another issue.
      placeholder: "rules-cuda"
    validations:
      required: true
  - type: textarea
    id: familiarity
    attributes:
      label: Your familiarity with the member and its domain
      description: What you build with it, the related field you work in, how long you have used it.
    validations:
      required: true
  - type: textarea
    id: technical-contributions
    attributes:
      label: Technical contributions to the member
      description: Required. Pull requests or commits — fixes, features, fixture and CI care, documentation. Link them.
      placeholder: "PR #12 — the manifest-merge fix; PR #18 — the min-sdk fixture"
    validations:
      required: true
  - type: textarea
    id: outreach-contributions
    attributes:
      label: Technical outreach and promotion contributions
      description: Required. Technical articles, videos, blogs, tutorials or examples about the member or its domain, preferably published on a public platform. Link them.
      placeholder: "a manifest-merger walkthrough on a blog; a getting-started video for the member"
    validations:
      required: true
  - type: textarea
    id: maintenance-plan
    attributes:
      label: Maintenance plan
      description: Required, and both sides of the role — the daily technical upkeep you commit to (triage, fixes, fixture and CI care), and the ongoing popularization you plan to keep doing.
    validations:
      required: true
  - type: textarea
    id: referrer
    attributes:
      label: Referrer
      description: An existing maintainer of a related member who supports this application, if one knows your work.
