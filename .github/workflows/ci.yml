name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The mcpp release the consumers build with. Raising it is what admits a
  # member that relies on a newer engine; the README states each member's floor.
  MCPP_VERSION: 2026.9.7.1
  # PINNED, AND WITHOUT IT THE CACHE BELOW CACHED NOTHING.
  #
  # A released mcpp is self-contained: with no `MCPP_HOME`, `mcpp self env`
  # reports the extracted tarball's own directory as its home, so every install
  # landed in `$GITHUB_WORKSPACE/mcpp-<ver>-linux-x86_64/` while the cache
  # saved and restored `~/.mcpp` -- a directory mcpp never touched. Every run
  # was therefore the cold case, which is what the 90-minute budget below was
  # sized for. mcpp's own ci-linux.yml pins it for this reason and says so.
  #
  # Set per JOB rather than here: the path differs by platform, and a
  # workflow-level `/home/runner/.mcpp` would silently be wrong on the other
  # two runners -- wrong in the direction that still appears to work, which is
  # the kind this repository has already paid for once.

jobs:
  consumers:
    name: consumers (linux x86_64)
    runs-on: ubuntu-24.04
    env:
      MCPP_HOME: /home/runner/.mcpp
    # 90 rather than 60: the SYCL fixture pulls three payloads this job did not
    # need before -- dpcpp (578 MB installed), gcc (265 MB) and cuda-nvcc
    # (319 MB) -- and a cold cache downloads all of them before the first
    # compile. The cache key includes the fixtures' manifests, so a run that
    # changes one of them is always the cold case.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache the mcpp sandbox
        uses: actions/cache@v4
        with:
          path: ~/.mcpp
          key: mcpp-sandbox-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-${{ hashFiles('tests/*/mcpp.toml') }}
          restore-keys: |
            mcpp-sandbox-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-

      - name: Fetch the released mcpp
        run: |
          curl -L -fsS --retry 3 --retry-all-errors -o mcpp.tar.gz \
            "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/mcpp-${MCPP_VERSION}-linux-x86_64.tar.gz"
          tar -xzf mcpp.tar.gz
          MCPP="$PWD/mcpp-${MCPP_VERSION}-linux-x86_64/bin/mcpp"
          "$MCPP" --version
          # THE BUNDLED xlings, NAMED EXPLICITLY BECAUSE `MCPP_HOME` IS PINNED.
          #
          # A released tarball carries its own xlings at `registry/bin/xlings`
          # and finds it there when its home IS that tarball. Pinning the home
          # elsewhere moves the place mcpp looks, so the first command fails
          # with `xlings binary not found` -- measured. The override is needed
          # only for that first call: mcpp copies the binary into the pinned
          # home and answers from there afterwards.
          export MCPP_VENDORED_XLINGS="$PWD/mcpp-${MCPP_VERSION}-linux-x86_64/registry/bin/xlings"
          "$MCPP" self config --mirror GLOBAL
          echo "MCPP=$MCPP" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$MCPP_VENDORED_XLINGS" >> "$GITHUB_ENV"

      # The rule's output is a header holding the SPIR-V module; the program
      # checks the magic number in its first word, so no Vulkan runtime is
      # needed and what is tested is the rule and the engine path feeding it.
      # ONE PACKAGE, ONE VERSION. `mcpp::plugins::version` was `0.1.1` while the
      # package was `0.2.6`, and nothing noticed because nothing read it. Every
      # rule now states it with `mcpp::fact`, and this compares the two
      # spellings so a stale constant is a red build rather than a wrong entry
      # in every consumer's log.
      - name: the collection states its own version
        run: |
          declared=$(sed -n 's/^version *= *"\(.*\)".*/\1/p' mcpp.toml | head -1)
          insource=$(sed -n 's/.*version *= *"\(.*\)";.*/\1/p' src/plugins.cppm | head -1)
          echo "mcpp.toml=$declared  src/plugins.cppm=$insource"
          if [ "$declared" != "$insource" ]; then
            echo "FAIL: mcpp.toml says '$declared' and src/plugins.cppm says '$insource'"
            exit 1
          fi
          echo "ok: one version, two files agreeing"

      - name: rules-spirv through a consumer
        working-directory: tests/spirv-consumer
        run: |
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^magic=07230203' run.log

      # THE MODULE SURFACE, AND THE COLLISION IT DISSOLVES.
      #
      # This fixture has `shaders/a/scale.comp` and `shaders/b/scale.comp` --
      # one stem, two directories -- which the step below this one asserts is
      # REFUSED when the two would produce one output. They no longer do: the
      # directory is part of the namespace, the generated file's path and the
      # array's name, so both are built and reached as `shaders::a::scale_comp`
      # and `shaders::b::scale_comp`.
      #
      # The program asserts the two arrays are DISTINCT OBJECTS, not only that
      # both carry the SPIR-V magic number. Without that assertion this fixture
      # passed while both accessors returned one array: the two generated data
      # headers were byte-identical, and GCC's `#pragma once` treats two files
      # with the same size and content as the same file, so the second include
      # silently did nothing.
      - name: rules-spirv through the module surface
        working-directory: tests/spirv-module-consumer
        run: |
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^a/scale.comp: magic=07230203' run.log
          grep -q '^b/scale.comp: magic=07230203' run.log
          grep -q '^default/scale.comp: magic=07230203' run.log
          grep -q '^all ok' run.log
          # A DIRECTORY NAMED AFTER A C++ KEYWORD. `a` and `b` are ordinary
          # identifiers and cannot tell a name filter that knows the keywords
          # from one that does not; without the guard this is
          # `namespace default {` and the generated file does not parse.
          grep -q '^namespace default_ {' \
            target/.build-mcpp/out/spirv/shader_app.shaders.cppm \
            || { echo "FAIL: the keyword directory did not get its trailing underscore"
                 grep -n namespace target/.build-mcpp/out/spirv/shader_app.shaders.cppm
                 exit 1; }
          # The point of the surface: a consumer names no generated file.
          if grep -rn 'scale_comp\.h\|\.inc"' src/; then
            echo "FAIL: a consumer source names a generated file"
            exit 1
          fi
          echo "ok: the consumer names only the module"
          # And what it imports really is a generated module interface.
          #
          # `shader_app`, while this directory is `spirv-module-consumer`. The
          # module root is derived from `[package] name`, and the two are
          # deliberately different here: a derivation that fell back to the
          # manifest directory's leaf -- which is what this rule did before mcpp
          # 2026.9.7.1 gave build programs `mcpp::package_name()` -- would write
          # `spirv_module_consumer.shaders.cppm` and this test would find no file.
          iface=target/.build-mcpp/out/spirv/shader_app.shaders.cppm
          test -f "$iface" || {
            echo "FAIL: no module interface at $iface"
            find target/.build-mcpp/out/spirv -name '*.cppm' -print
            exit 1; }
          grep -q '^export module shader_app.shaders;' "$iface"
          # The interface must name no standard-library type: one that does
          # carries that header's templates in every consumer's BMI, measured at
          # 727 times the size of the std-free form.
          if grep -n 'std::\|#include <' "$iface"; then
            echo "FAIL: the generated module interface names a standard-library type"
            exit 1
          fi
          echo "ok: the generated interface is std-free"

      # THE SECOND COMPILER, THROUGH THE SAME FIXTURE. glslang and glslc share
      # almost no flags -- glslc's `-mfmt=c` is a bare initialiser list where
      # glslang's `-x --vn` is a complete declaration, and glslc's `-S` means
      # "emit assembly" where glslang's names a stage -- so the rule writes the
      # declaration itself on this route. The program is unchanged, which is the
      # assertion: one source, two compilers, one answer.
      - name: rules-spirv through glslc
        working-directory: tests/spirv-consumer
        run: |
          curl -L -fsS --retry 3 --retry-all-errors -o shaderc.tar.gz \
            "https://github.com/xlings-res/shaderc/releases/download/2026.3/shaderc-2026.3-linux-x86_64.tar.gz"
          tar -xzf shaderc.tar.gz
          rm -rf target
          MCPP_GLSLC="$PWD/shaderc-2026.3/bin/glslc" "$MCPP" build
          test -f target/.build-mcpp/out/spirv/scale_comp.inc
          MCPP_GLSLC="$PWD/shaderc-2026.3/bin/glslc" "$MCPP" run | tee run-glslc.log
          grep -q '^magic=07230203' run-glslc.log
          rm -rf shaderc.tar.gz shaderc-2026.3

      # TWO SHADERS THAT DIFFER ONLY BY DIRECTORY.
      #
      # The output name is the stem and the stage, so `a/x.vert` and `b/x.vert`
      # both produce `x_vert.h` declaring `x_vert_spv`. Before this rule checked
      # for it, ninja caught the duplicate output -- so it was never silent, but
      # the message named the generated file and neither shader, arrived as a
      # graph-loading failure rather than as this rule's refusal, and stated no
      # way out. A project with one shader per stage never meets it, which is
      # how it survived; a graphics project organising shaders by purpose is the
      # first to have two.
      - name: two shaders with one stem are refused, naming both
        working-directory: tests/spirv-consumer
        run: |
          set -e
          mkdir -p shaders/dup
          cp shaders/scale.comp shaders/dup/scale.comp
          # The fixture globs `shaders/*.comp`; widen it for this step only.
          cp mcpp.toml mcpp.toml.bak
          sed -i 's#shaders/\*.comp#shaders/**/*.comp#' mcpp.toml
          rm -rf target
          if "$MCPP" build > dup.log 2>&1; then
            echo "FAIL: two shaders mapping to one output were accepted"
            exit 1
          fi
          for needle in 'two shaders map to one output' 'shaders/scale.comp' \
                        'shaders/dup/scale.comp' 'scale_comp_spv' 'rename one of them'; do
            grep -q -- "$needle" dup.log || {
              echo "FAIL: the refusal does not mention '$needle'"
              tail -20 dup.log
              exit 1
            }
          done
          echo "ok: refused, naming both shaders, the symbol and the way out"
          # …and the fixture still builds once the duplicate is gone, so this
          # step cannot leave a project that refuses everything.
          mv mcpp.toml.bak mcpp.toml
          rm -rf shaders/dup target
          "$MCPP" build > restored.log 2>&1 || {
            echo "FAIL: the fixture no longer builds after the duplicate was removed"
            tail -20 restored.log; exit 1; }
          rm -f dup.log restored.log
          echo "ok: and it builds again with one shader per stem"

      # THE OTHER GENERATED INTERFACE, AND THE ONE THAT IS NOT A PAYLOAD.
      #
      # `mcpp.tools.island` generates the boundary a device island is reached
      # across: the `extern "C"` header its compiler includes, and the module the
      # C++ side imports. The entry points are declared once, so the copy that
      # can drift is gone -- and at a C-linkage boundary that copy is the worst
      # one available, because nothing mangles and two disagreeing declarations
      # link cleanly.
      #
      # The island here is a `.c` rather than a `.cu`: the generator does not
      # know what compiler produced the object, and a fixture needing a vendor
      # toolkit could only run where that toolkit is published.
      - name: island interfaces are generated, not written
        working-directory: tests/island-interface
        run: |
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^out\[0\]=6 out\[1\]=12 out\[2\]=18 out\[3\]=24' run.log
          grep -q '^all ok' run.log
          # Neither artefact is written by hand.
          test ! -f include/island_interface.kernels.h
          d=target/.build-mcpp/out/island
          grep -q 'extern "C" {' "$d/island_interface.kernels.h"
          grep -q '^export using ::saxpy_device;' "$d/island_interface.kernels.cppm"
          grep -q '^export using ::scale_device;'  "$d/island_interface.kernels.cppm"
          # The module re-exports NAMES: a second copy of a signature is the
          # thing this generator exists to remove, so its appearance here is a
          # regression even though it would compile.
          if grep -q 'int saxpy_device(' "$d/island_interface.kernels.cppm"; then
            echo "FAIL: the module restated a signature instead of re-exporting a name"
            exit 1
          fi
          # NEITHER SIDE INCLUDES ANYTHING. The C++ side imports, and the
          # island reads the generated header through the compiler's
          # forced-include flag -- so a project using this generator has no
          # header in its source tree and no line naming one.
          if grep -rn '#include' src/main.cpp src/app.cppm src/kernels/saxpy.c src/cpu/saxpy.c; then
            echo "FAIL: a source names an include; the generator exists to remove it"
            exit 1
          fi
          # THE SEAM IS A MODULE OF THIS PROJECT IMPORTING THE GENERATED ONE.
          # `main.cpp` is not a module unit, so its import said nothing about
          # ordering two module interfaces where one is written during the
          # build. `src/app.cppm` is, and it is the shape every example under
          # examples/09-heterogeneous has.
          grep -q '^import island_interface.kernels;' src/app.cppm \
            || { echo "FAIL: the seam no longer imports the generated module"; exit 1; }
          if grep -q 'saxpy_device\|scale_device' src/main.cpp; then
            echo "FAIL: the consumer names a boundary symbol; the seam exists to hide it"
            exit 1
          fi
          # AND THE CHECK THAT INCLUDE USED TO DO IS STILL THERE. The compiler
          # sees the declarations, so a definition whose signature drifted from
          # the generated header fails where it was written rather than at the
          # link.
          grep -q 'include' build.mcpp \
            || { echo "FAIL: the build program no longer forces the header in"; exit 1; }
          # THE MARKER SELECTS, AND THE UNMARKED MUST NOT TRAVEL. The island has
          # a static helper and an unmarked external function; a scan that
          # exported whatever the file contained would still pass every check
          # above, because both generated files would merely be larger.
          for name in internal_device unexported_helper; do
            if grep -q "$name" "$d/island_interface.kernels.h" \
            || grep -q "$name" "$d/island_interface.kernels.cppm"; then
              echo "FAIL: $name is not marked and reached the generated boundary"
              exit 1
            fi
          done
          # The marker is defined by the header, so the island needs no other
          # arrangement to compile.
          grep -q '^#define MCPP_EXPORT_C$' "$d/island_interface.kernels.h"
          # A signature that wrapped across lines survived: the scan matches
          # parentheses rather than reading lines.
          grep -q 'int scale_device(float a, float\* out, unsigned n);' \
            "$d/island_interface.kernels.h"
          echo "ok: one declaration, two generated artefacts, and only what was marked"

      # THE SEAM'S OTHER HALF, AND THE DISAGREEMENT THAT NOTHING ELSE CATCHES.
      #
      # A seam has two implementations of one `extern "C"` boundary -- a device
      # island and a host fallback -- and exactly one of them is in any link.
      # `build.mcpp` hands `scan` both files unconditionally, because both exist
      # on disk in either build and the manifest decides which is compiled. A
      # build program that asked `mcpp::accel()` instead would carry a second
      # copy of a decision the manifest already states.
      #
      # The CPU leg is not a variant of the step above. It is the build in which
      # the device half is ABSENT, so a generator that read only the file it was
      # given first would produce an empty boundary and the C++ side would fail
      # on an unresolved name.
      - name: the same boundary, generated from the half the build selected
        working-directory: tests/island-interface
        run: |
          rm -rf target
          "$MCPP" build --no-accel > cpu.log 2>&1 || {
            echo "FAIL: the CPU leg does not build"; tail -25 cpu.log; exit 1; }
          "$MCPP" run --no-accel | tee cpurun.log
          grep -q '^out\[0\]=6 out\[1\]=12 out\[2\]=18 out\[3\]=24' cpurun.log
          grep -q '^all ok' cpurun.log
          # ONE set of declarations, not two. Both files mark the same two entry
          # points; a merge that appended would declare each twice, which the
          # module rejects as a redefinition and the header silently accepts.
          d=target/.build-mcpp/out/island
          n=$(grep -c '^export using ::' "$d/island_interface.kernels.cppm")
          [ "$n" = 2 ] || {
            echo "FAIL: the module re-exports $n names; the two halves declare 2"
            cat "$d/island_interface.kernels.cppm"; exit 1; }
          echo "ok: the CPU leg reaches the same generated boundary"

      # AND THE REVERSE LEG, WHICH IS THE POINT OF SCANNING BOTH.
      #
      # C language linkage does not mangle and the two halves are never in one
      # link, so two declarations of one name that disagree produce a clean
      # build and an artifact that reads its arguments by whichever signature it
      # happened to be compiled with. `scan` is the only place both texts exist
      # at once, so it is the only place that can refuse.
      - name: two halves that disagree are refused where both texts exist
        working-directory: tests/island-interface
        run: |
          cp src/cpu/saxpy.c /tmp/cpu_saxpy.bak
          sed -i 's/^int scale_device(float a, float\* out, unsigned n) {/int scale_device(float a, float* out, double n) {/' \
            src/cpu/saxpy.c
          grep -q 'double n' src/cpu/saxpy.c || {
            echo "FAIL: the fixture was not perturbed; this step would assert nothing"
            cp /tmp/cpu_saxpy.bak src/cpu/saxpy.c; exit 1; }
          rm -rf target
          set +e
          "$MCPP" build > neg.log 2>&1
          rc=$?
          set -e
          cp /tmp/cpu_saxpy.bak src/cpu/saxpy.c
          [ "$rc" != 0 ] || { echo "FAIL: the disagreement was accepted"; tail -20 neg.log; exit 1; }
          grep -q 'declare it differently' neg.log || {
            echo "FAIL: refused, but not for this reason"; tail -20 neg.log; exit 1; }
          # Both file names, because a diagnostic naming one leaves the reader
          # to find the other.
          grep -q 'src/kernels/saxpy.c' neg.log
          grep -q 'src/cpu/saxpy.c' neg.log
          echo "ok: refused, naming both definitions and both signatures"
          # And it builds again once they agree, so this step cannot leave a
          # fixture that refuses everything.
          rm -rf target
          "$MCPP" build > restored.log 2>&1 || {
            echo "FAIL: the fixture no longer builds after the perturbation was undone"
            tail -20 restored.log; exit 1; }
          rm -f neg.log restored.log cpu.log cpurun.log
          echo "ok: and it builds again once the two agree"

      # NO BUILD PROGRAM AT ALL, WHICH IS WHAT THE TWO KEYS BUY.
      #
      # `spirv-consumer` and `spirv-module-consumer` both write a `build.mcpp`,
      # so neither can tell whether mcpp would have written it. This fixture has
      # a dependency edge naming a feature and nothing else: no `host-module`,
      # no build program. The step asserts both absences, because a fixture that
      # gained one by accident would still pass every other check here.
      - name: rules-spirv with no build program
        working-directory: tests/spirv-zero-config
        run: |
          test ! -f build.mcpp || { echo "FAIL: the fixture has its own build program"; exit 1; }
          grep -q 'host-module' mcpp.toml && { echo "FAIL: the fixture declares host-module"; exit 1; }
          "$MCPP" build | tee build.log
          grep -q 'Rules mcpp.rules.spirv' build.log \
            || { echo "FAIL: the build did not report which rule it ran"; exit 1; }
          "$MCPP" run | tee run.log
          grep -q '^magic=07230203' run.log
          grep -q '^all ok' run.log
          # And the program mcpp wrote is where it says it is, and is the one a
          # project would take over.
          test -f target/.build-mcpp/build.mcpp
          grep -q '^import mcpp.rules.spirv;' target/.build-mcpp/build.mcpp
          echo "ok: one edge, no program, shaders compiled"

      # WHERE THE BYTES LIVE, TWICE, AGAINST ONE UNCHANGED CONSUMER.
      #
      # Both fixtures' `src/main.cpp` has the same shape as the header-stored
      # one: one import, one call, a `payload` struct. That is the claim -- the
      # storage is not something a consumer can see -- and it is why these are
      # separate fixtures rather than options on an existing one.
      #
      # `object` is what a project reaches for above roughly 1 MB of total
      # payload; below that the header route is faster, measured at 1.10s
      # against 2.17s for 100 shaders of 16 KB.
      - name: rules-spirv with object storage
        working-directory: tests/spirv-object-storage
        run: |
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^magic=07230203' run.log
          grep -q '^all ok' run.log
          # The bytes are a section, so the compiler never saw a C array: the
          # payload is a bare `.spv` and an `.S` names it with `.incbin`.
          test -f target/.build-mcpp/out/spirv/scale_comp.spv
          test -f target/.build-mcpp/out/spirv/spirv_object_storage.shaders.payload.S
          grep -q '\.incbin' target/.build-mcpp/out/spirv/spirv_object_storage.shaders.payload.S
          if ls target/.build-mcpp/out/spirv/*.inc >/dev/null 2>&1; then
            echo "FAIL: object storage still produced a C initialiser list"
            exit 1
          fi
          # `pCode` wants four-byte alignment and a section directive alone does
          # not promise it.
          grep -q '\.balign 4' target/.build-mcpp/out/spirv/spirv_object_storage.shaders.payload.S
          echo "ok: the payload is a section, not generated source"

      - name: rules-spirv with sidecar storage
        working-directory: tests/spirv-sidecar
        run: |
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^magic=07230203' run.log
          grep -q '^all ok' run.log
          test -f target/.build-mcpp/out/spirv/scale_comp.spv
          # THE REVERSE LEG, AND IT IS THE POINT OF THIS STORAGE. The accessor
          # opens a path relative to the working directory, so the program finds
          # its shaders from the package root and must not from anywhere else.
          # Without this half the fixture would pass against an implementation
          # that had quietly embedded the payload after all.
          bin=$(ls target/*/*/bin/spirv-sidecar)
          bin=$(cd "$(dirname "$bin")" && pwd)/$(basename "$bin")
          if (cd /tmp && "$bin" > away.log 2>&1); then
            echo "FAIL: the sidecar program succeeded from the wrong directory"
            cat /tmp/away.log
            exit 1
          fi
          grep -q 'sidecar payload was not found' /tmp/away.log \
            || { echo "FAIL: it failed for some other reason"; cat /tmp/away.log; exit 1; }
          echo "ok: found from the package root, reported missing from elsewhere"

      # SLANG: A DIFFERENT LANGUAGE, THE SAME SURFACE.
      #
      # The point of this step is not that Slang compiles -- it is that a
      # consumer cannot tell which rule produced its shaders. The fixture's
      # `main.cpp` contains nothing Slang-specific and would compile unchanged
      # against `mcpp.rules.spirv` if the shader were GLSL.
      #
      # It needs an engine that knows the `.slang` extension: a constrained
      # glob's `accel` key does not make a file a device source, the engine's
      # own `kDeviceExtensions` table does, and before that table listed
      # `.slang` the file fell through to the ordinary source scan and was
      # refused with "mcpp has no role for the extension".
      - name: rules-slang through a consumer
        working-directory: tests/slang-consumer
        run: |
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^scale.slang: magic=07230203' run.log
          grep -q '^all ok' run.log
          if grep -rn 'scale\.h\|\.inc"' src/; then
            echo "FAIL: a consumer source names a generated file"
            exit 1
          fi
          grep -q '^export module slang_consumer.shaders;' \
            target/.build-mcpp/out/slang/slang_consumer.shaders.cppm
          echo "ok: a Slang shader reached through the same surface as a GLSL one"

      # A tool, not a rule: the header is written while the build program runs,
      # so there is no action to schedule. The second build is the measurement
      # that matters -- editing the data file must reach the binary, which is
      # the fast-path comparison mcpp 2026.9.5.4 added and the reason this job
      # pins that version.
      - name: tools-embed through a consumer
        working-directory: tests/embed-consumer
        run: |
          "$MCPP" run | tee run.log
          grep -q '^size=33 sum=3189 text=mcpp.tools.embed fixture payload' run.log
          printf 'changed\n' > data/message.txt
          "$MCPP" run | tee run2.log
          grep -q '^size=8 ' run2.log
          git checkout -- data/message.txt

      # THE SAME SURFACE FROM A TOOL RATHER THAN A RULE.
      #
      # `file()` writes a header per input and the consumer includes each by
      # name; `group()` hands the same headers to the same generator the shader
      # rules use, so a set of data files and a set of shaders reach a consumer
      # through one shape.
      #
      # The size assertion is the one that matters. `<id>_size` counts ELEMENTS
      # and the surface reports BYTES, and `null_terminate` appends a byte that
      # `_size` does not count -- so neither `_size` nor `sizeof` is the answer
      # on its own. The fixture compares the payload against its exact text, and
      # a trailing NUL fails it.
      - name: tools-embed through the module surface
        working-directory: tests/embed-module-consumer
        run: |
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^alpha.txt: bytes=46 ok' run.log
          grep -q '^beta.txt: bytes=15 ok' run.log
          grep -q '^all ok' run.log
          if grep -rn 'alpha_txt\.h\|beta_txt\.h' src/; then
            echo "FAIL: a consumer source names a generated file"
            exit 1
          fi
          echo "ok: two payloads, one import, sizes exact"

      # Compiles the device unit on a machine with no GPU: the clang route
      # produces sm_89 code from the payload toolkit. Running it needs a
      # device, so the run is of the CPU variant, which the same seam serves.
      - name: rules-cuda through a consumer
        working-directory: tests/cuda-consumer
        run: |
          "$MCPP" build
          "$MCPP" build --no-accel
          "$MCPP" run --no-accel | tee run.log
          grep -q '^12 24 36 48' run.log

      # The same shape one API over: HIP on the NVIDIA platform is a header
      # layer over the CUDA runtime, so this compiles the same device code
      # through a different spelling and needs no ROCm. The device object is
      # asserted to exist, because a rule that submitted no action at all would
      # otherwise leave a build that "succeeded" and produced nothing.
      - name: rules-hip through a consumer
        working-directory: tests/hip-consumer
        run: |
          "$MCPP" build
          test -f target/.build-mcpp/out/saxpy.hip.o
          "$MCPP" build --no-accel
          "$MCPP" run --no-accel | tee run.log
          grep -q '^12 24 36 48' run.log

      # SYCL is compiled by a second compiler, so this step is the one that
      # would catch a payload the rule cannot drive. Two objects have to exist:
      # the unit's own, and the device-link wrapper that registers its image --
      # without the second the program links and finds no kernel at run time.
      - name: rules-sycl through a consumer
        working-directory: tests/sycl-consumer
        run: |
          "$MCPP" build
          test -f target/.build-mcpp/out/saxpy.sycl.o
          test -f target/.build-mcpp/out/sycl_device_link.o
          "$MCPP" build --no-accel
          "$MCPP" run --no-accel | tee run.log
          grep -q '^12 24 36 48' run.log

      # EVERY RULE COMPILED FOR THIS HOST, which is a different claim from any
      # step above. Each of those exercises one rule and needs that rule's
      # payload, so a rule is only ever compiled on the platforms its payload
      # exists for -- and a rule's host-dependent halves are exactly the code
      # those platforms do not compile. This fixture names no accelerator, so
      # every rule returns before looking for a payload and nothing is
      # downloaded; what it asserts is that all six modules compile here.
      - name: every rule module compiles for this host
        run: |
          set -e
          # THE FIXTURE'S OWN DENOMINATOR. It asserts "every rule compiles
          # here", and "every" is a list it carries -- so a seventh member
          # added to this package would be covered by a step whose name says it
          # already is. The list is therefore compared against the package's
          # own `[features]` before the build, and the two must be equal.
          feats=$(sed -n '/^\[features\]/,/^# /p' mcpp.toml \
                  | grep -oE '^[a-z-]+ +=' | sed 's/ *=//' | grep -v '^default$' | sort)
          used=$(sed -n '/features = \[/,/\], host-module/p' tests/all-rules-compile/mcpp.toml \
                 | grep -oE '"[a-z-]+"' | tr -d '"' | sort)
          [ -n "$feats" ] || { echo "FAIL: read no features out of mcpp.toml"; exit 1; }
          [ "$feats" = "$used" ] || {
            echo "FAIL: the fixture does not name every published feature"
            echo "  package: $(echo $feats)"
            echo "  fixture: $(echo $used)"
            exit 1; }
          cd tests/all-rules-compile
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^all-rules-compile ok' run.log

      # TWO RULES IN ONE BUILD PROGRAM, which every step above has exactly
      # one of. With one, a rule can take the whole of `device_sources()` and
      # be right by accident; with two, that list holds a `.cu` AND a `.comp`,
      # and a rule that takes all of it hands its compiler a file the compiler
      # does not accept. Measured on the unfixed rules: the CUDA rule compiled
      # `scale.comp` as CUDA and the shader rule then failed on the `.cu`.
      #
      # Both device products are asserted to exist, because a rule that
      # submitted no action would otherwise leave a build that "succeeded".
      # The `--no-accel` leg is asserted separately: it is what proves a rule
      # whose backend is absent does nothing rather than complaining.
      - name: two rules in one build program
        working-directory: tests/multi-rule-consumer
        run: |
          "$MCPP" build
          test -f target/.build-mcpp/out/saxpy.cu.o
          test -f target/.build-mcpp/out/spirv/scale_comp.h
          test ! -f target/.build-mcpp/out/scale.cu.o
          "$MCPP" run --no-accel | tee run.log
          grep -q '^magic=(no shader in this build)' run.log
          grep -q '^12 24 36 48' run.log

      # THE PAYLOADS CAME FROM THE RULE, NOT FROM THE FIXTURE.
      #
      # Every fixture above builds, and that alone does not distinguish "the
      # rule declared its toolkit" from "the fixture still declares it": a
      # re-added `[xlings.workspace]` block would keep all of them green while
      # the claim this package makes stopped being true.
      #
      # The object is mcpp's own report of WHERE the entries came from. It
      # names the pass -- the graph's, not the root's -- so it separates the
      # two cases directly rather than by reading the manifests back.
      - name: the rules declare their own payloads
        run: |
          set -e
          # THE PROVISIONING LINE ONLY PRINTS ON A STAMP MISS, and the earlier
          # steps of this job have already written those stamps. Without
          # clearing them, the criterion's "no" and "this ran after the
          # fixtures" are the same reading. Removing them costs nothing: the
          # packages are still installed, so the re-provision is one xlings
          # round trip.
          #
          # THE PATH IS ASKED FOR, NOT ASSUMED. A released mcpp is
          # self-contained and its home is the extracted tarball unless
          # MCPP_HOME says otherwise -- so `rm -rf ~/.mcpp/provisioned` removed
          # nothing and this step failed on a working build. Measured: a local
          # rehearsal passed because a DEV build is disqualified from
          # self-contained mode and does use ~/.mcpp, so the rehearsal and CI
          # were clearing different directories.
          # Through a FILE rather than a pipe: on macOS this same expression
          # killed mcpp with `internal: unhandled exception: failed to write
          # formatted output`, because `awk ... exit` closes the read end at
          # the first match. Written the same way on every platform so the two
          # jobs cannot drift.
          "$MCPP" self env > mcpp-env.txt
          HOME_DIR=$(awk -F'= *' '/^MCPP_HOME/{print $2; exit}' mcpp-env.txt)
          [ -n "$HOME_DIR" ] || { echo "FAIL: could not read MCPP_HOME"; cat mcpp-env.txt; exit 1; }
          echo "clearing provisioning stamps under $HOME_DIR"
          rm -rf "$HOME_DIR/provisioned"
          for d in tests/cuda-consumer tests/hip-consumer \
                   tests/sycl-consumer tests/spirv-consumer; do
            # No project-side declaration is the first half of the claim, and
            # it is a property of a file this repository owns.
            if grep -qE '^\[(target\..*\.)?xlings\.workspace\]' "$d/mcpp.toml"; then
              echo "FAIL: $d declares payloads itself, so this step proves nothing"
              exit 1
            fi
            ( cd "$d" && rm -rf target && "$MCPP" build > prov.log 2>&1 ) || {
              echo "build failed in $d"; tail -20 "$d/prov.log"; exit 1; }
            grep -q 'entries declared by dependencies' "$d/prov.log" || {
              echo "FAIL: $d installed no payload the rule declared"
              grep -i 'provisioning' "$d/prov.log" || echo "(no provisioning line at all)"
              exit 1
            }
            echo "ok: $d — $(grep -m1 'entries declared by dependencies' "$d/prov.log")"
            rm -f "$d/prov.log"
          done
          # And the one fixture that DOES override, so the override path is on
          # this graph too: it declares one entry, and one version is installed.
          d=tests/multi-rule-consumer
          grep -q 'xlings.workspace' "$d/mcpp.toml" || {
            echo "FAIL: $d no longer demonstrates the override"; exit 1; }
          ( cd "$d" && rm -rf target && "$MCPP" build > prov.log 2>&1 ) || {
            echo "build failed in $d"; tail -20 "$d/prov.log"; exit 1; }
          XPKGS="$HOME_DIR/registry/data/xpkgs"
          n=$(ls -1 "$XPKGS/xim-x-glslang" | wc -l | tr -d ' ')
          [ "$n" = "1" ] || {
            echo "FAIL: the override installed $n versions of glslang:"
            ls -1 "$XPKGS/xim-x-glslang"
            exit 1
          }
          echo "ok: $d — one glslang, $(ls -1 "$XPKGS/xim-x-glslang")"
          rm -f "$d/prov.log"

      # THE HOST-LEAK ASSERTION, and what it measures was corrected once.
      #
      # Its first form grepped a verbose build for `/usr`. That reported
      # nothing wrong on a developer machine AND on a runner, while the runner
      # was in fact compiling the HIP device pass against the host's
      # `/usr/include/c++/14` -- because an IMPLICIT include search never
      # appears on a command line. The compiler's own `#include <...> search
      # starts here` list is where it is visible.
      #
      # The criterion is the C++ standard library specifically, not `/usr`
      # absence: mcpp's own compiles leave `/usr/include` on the list as a last
      # resort for C headers, and a stricter rule here would be stricter than
      # the engine it is checking. What must never appear is a C++ library
      # nothing in this ecosystem chose.
      # AND THE C LIBRARY, WHICH THE ASSERTION BELOW CANNOT SEE.
      #
      # "no host C++ standard library" was true of the SYCL rule while its
      # device units compiled against the HOST's C library: dpcpp's clang had
      # no ecosystem glibc on its search list at all, so `/usr/include` was not
      # a last resort there, it was the only one. The reasoning below -- that
      # `/usr/include` last is what the engine itself does -- holds only when
      # the ecosystem's own C library is ahead of it.
      #
      # THE OBJECT IS THE COMPILER'S OWN SEARCH LIST. A build log carries the
      # ENGINE's compile lines too, and those name the ecosystem glibc, so
      # grepping the log passes for a rule whose device compile names nothing.
      # Measured: the HIP rule's device command carries neither `--sysroot` nor
      # `-isystem <glibc>` and is nonetheless correct, because the compiler it
      # drives is configured with the ecosystem glibc. Only the search list
      # separates that from the case that is wrong.
      - name: every device compile finds the ecosystem C library first
        run: |
          bash tools/check_device_c_library.sh \
            tests/cuda-consumer tests/hip-consumer tests/sycl-consumer

      - name: no device compile reads a host C++ standard library
        run: |
          fail=0
          for d in tests/cuda-consumer tests/hip-consumer tests/sycl-consumer; do
            ( cd "$d" && rm -rf target && "$MCPP" build -v > build.log 2>&1 ) || {
              echo "build failed in $d"; tail -20 "$d/build.log"; exit 1; }
            hits=$(grep -oE '/(usr|opt)/[^ ]*(c\+\+|include/c\+\+)[^ ]*' "$d/build.log" | sort -u | head -5)
            if [ -n "$hits" ]; then
              echo "host C++ standard library reached from $d:"; echo "$hits"; fail=1
            else
              echo "ok: $d reads no host C++ standard library"
            fi
          done
          [ "$fail" -eq 0 ]

  # ── THE SAME RULE ON THE OTHER TWO PLATFORMS ────────────────────────────────
  #
  # `rules-spirv` is the only member whose payload this ecosystem publishes for
  # all three, so it is the only one that can be checked on all three. What this
  # job proves is the claim the per-platform declaration makes: a project writes
  # the rule edge and nothing else, and the compiler that arrives is whichever
  # one that platform has -- glslang on Linux, glslc here.
  #
  # ONLY THE SPIR-V FIXTURE. The CUDA, HIP and SYCL payloads are Linux-only
  # upstream, so a matrix that ran every fixture everywhere would be red for a
  # reason that is not a defect.
  rules-cross-platform:
    name: rules (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, matching mcpp's own macOS CI, and the reason is a
          # measured limitation of the older release rather than a preference.
          #
          # On macos-14 a build program fails to LINK, with
          #
          #   ld64.lld: error: undefined symbol:
          #       std::__1::__is_posix_terminal(__sFILE*)
          #
          # referenced from `std::__1::__print::__is_terminal`. That symbol
          # lives in the libc++ DYLIB and was added in a version macOS 14 does
          # not ship, and the build program's link resolves `-lc++` to the
          # system copy rather than to the LLVM payload's. It is reached
          # through `import std` itself, so no rule package can avoid it -- the
          # rules stopped using `std::println` for the same reason and it was
          # not enough.
          #
          # Recorded rather than worked around here: the engine-side half is
          # `host_link_tokens` returning before it adds the payload's runtime
          # directories on macOS. Once a release carries that, this moves back
          # to macos-14, which is the floor mcpp's README states.
          - name: macos arm64
            runs-on: macos-15
            asset: macosx-arm64.tar.gz
            dir-suffix: macosx-arm64
          - name: windows x86_64
            runs-on: windows-2022
            asset: windows-x86_64.zip
            dir-suffix: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Pin MCPP_HOME under this runner's home
        run: |
          set -e
          # The value has to be in the HOST's path syntax, not Git Bash's.
          # `$HOME` there is `/c/Users/runneradmin`, and mcpp hands this
          # variable to xlings, which is a native Windows program: it answered
          # `The filename, directory name, or volume label syntax is
          # incorrect.` and exited 1, from inside a provisioning step whose own
          # message named a package rather than a path.
          H="$HOME/.mcpp"
          command -v cygpath >/dev/null && H=$(cygpath -m "$H")
          echo "MCPP_HOME=$H" >> "$GITHUB_ENV"

      - name: Cache the mcpp sandbox
        uses: actions/cache@v4
        with:
          path: ~/.mcpp
          key: mcpp-sandbox-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-${{ hashFiles('tests/spirv-consumer/mcpp.toml') }}
          restore-keys: |
            mcpp-sandbox-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-

      - name: Fetch the released mcpp
        run: |
          set -e
          curl -L -fsS --retry 3 --retry-all-errors -o mcpp.pkg \
            "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/mcpp-${MCPP_VERSION}-${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.zip) unzip -q mcpp.pkg ;;
            *)     tar -xzf mcpp.pkg ;;
          esac
          dir="mcpp-${MCPP_VERSION}-${{ matrix.dir-suffix }}"
          MCPP="$PWD/$dir/bin/mcpp"
          "$MCPP" --version
          # The bundled xlings, named explicitly because MCPP_HOME is pinned
          # away from the tarball. See the Linux job for the measurement.
          #
          # The suffix is the host's: the Windows distribution ships
          # `registry/bin/xlings.exe`, and a variable pointing at a file that
          # does not exist produces `error: xlings binary not found` naming
          # three remedies, none of which is the one that applies.
          # Two host differences, and the second one is the interesting one.
          # The suffix: the Windows distribution ships `xlings.exe`. The PATH
          # SHAPE: this job runs under Git Bash, whose `$PWD` is a POSIX path
          # (`/d/a/...`), while `mcpp` is a native Windows program and reads
          # this variable as a Windows path. Both failures report the same
          # `error: xlings binary not found` and offer the same three remedies,
          # none of which is "the path you gave is in the other syntax".
          XL="$PWD/$dir/registry/bin/xlings"
          [ -f "$XL" ] || XL="$XL.exe"
          test -f "$XL" || { echo "no vendored xlings at $XL"; exit 1; }
          command -v cygpath >/dev/null && XL=$(cygpath -m "$XL")
          export MCPP_VENDORED_XLINGS="$XL"
          "$MCPP" self config --mirror GLOBAL
          echo "MCPP=$MCPP" >> "$GITHUB_ENV"
          echo "MCPP_VENDORED_XLINGS=$MCPP_VENDORED_XLINGS" >> "$GITHUB_ENV"

      # FIRST, BECAUSE IT IS THE CHEAPER QUESTION AND THE MORE INFORMATIVE
      # ANSWER. Every other step here drives one rule end to end and needs
      # that rule's payload; this one names no accelerator, downloads nothing,
      # and asks only whether all six modules COMPILE for this host -- which
      # is the half of a rule that a Linux-only CI never sees. Run after the
      # end-to-end step, its failure arrived as somebody else's build error:
      # `no member named 'popen' in the global namespace`, reported against a
      # consumer that had nothing to do with it.
      - name: every rule module compiles for this host
        run: |
          set -e
          # THE FIXTURE'S OWN DENOMINATOR. It asserts "every rule compiles
          # here", and "every" is a list it carries -- so a seventh member
          # added to this package would be covered by a step whose name says it
          # already is. The list is therefore compared against the package's
          # own `[features]` before the build, and the two must be equal.
          feats=$(sed -n '/^\[features\]/,/^# /p' mcpp.toml \
                  | grep -oE '^[a-z-]+ +=' | sed 's/ *=//' | grep -v '^default$' | sort)
          used=$(sed -n '/features = \[/,/\], host-module/p' tests/all-rules-compile/mcpp.toml \
                 | grep -oE '"[a-z-]+"' | tr -d '"' | sort)
          [ -n "$feats" ] || { echo "FAIL: read no features out of mcpp.toml"; exit 1; }
          [ "$feats" = "$used" ] || {
            echo "FAIL: the fixture does not name every published feature"
            echo "  package: $(echo $feats)"
            echo "  fixture: $(echo $used)"
            exit 1; }
          cd tests/all-rules-compile
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^all-rules-compile ok' run.log

      - name: rules-spirv through a consumer
        working-directory: tests/spirv-consumer
        run: |
          set -e
          "$MCPP" build
          "$MCPP" run | tee run.log
          grep -q '^magic=07230203' run.log

      # The same provenance criterion the Linux job applies: the payload has to
      # come from the GRAPH, not from the fixture. Without it, a fixture that
      # quietly regained an `[xlings.workspace]` would keep this green while the
      # claim stopped being true.
      - name: the rule declared its own compiler
        working-directory: tests/spirv-consumer
        run: |
          set -e
          if grep -qE '^\[(target\..*\.)?xlings\.workspace\]' mcpp.toml; then
            echo "FAIL: the fixture declares payloads itself"; exit 1
          fi
          # `mcpp self env > file`, not `mcpp self env | awk`. Measured on
          # macos-15: through a pipe whose reader exits at the first match,
          # mcpp died with `internal: unhandled exception: failed to write
          # formatted output` and exit 70. A file has no reader to disappear.
          "$MCPP" self env > env.txt
          HOME_DIR=$(awk -F'= *' '/^MCPP_HOME/{print $2; exit}' env.txt)
          test -n "$HOME_DIR" || { echo "FAIL: mcpp self env named no MCPP_HOME"; cat env.txt; exit 1; }
          rm -rf "$HOME_DIR/provisioned" target
          "$MCPP" build > prov.log 2>&1
          grep -q 'entries declared by dependencies' prov.log || {
            echo "FAIL: no payload came from the graph"
            grep -i provisioning prov.log || echo "(no provisioning line at all)"
            exit 1; }
          echo "ok: $(grep -m1 'entries declared by dependencies' prov.log)"
